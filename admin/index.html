ligations contractuelles :","Les conditions d'accès et d'appartenance au réseau ;","Les territoires et les exclusivités ;","Les obligations de commercialisation et les objectifs de performance ;","Les conditions d'utilisation de la marque et des signes distinctifs ;","Les obligations d'approvisionnement et de référencement ;","Les conditions de durée, de renouvellement et de cessation des relations.","Les interventions tiennent compte des règles applicables aux accords verticaux, notamment en matière d'exclusivité, de restrictions territoriales, de fixation des prix de revente et de ventes en ligne."]},{title:"Achats, référencement et approvisionnements",blocks:[{type:"paragraph",items:["L'organisation des achats et des approvisionnements constitue un enjeu contractuel et économique important pour de nombreux réseaux de distribution."]},{type:"paragraph",items:["Selon le modèle retenu, elle peut reposer sur une centrale d'achat, une centrale de référencement, des accords conclus directement avec les fournisseurs ou une combinaison de ces dispositifs."]},{type:"paragraph",items:["Le cabinet accompagne les entreprises dans :"]},{type:"list",items:["La structuration juridique des centrales d'achat et des centrales de référencement ;","La définition des modalités de référencement et de sélection des fournisseurs ;","La rédaction, l'audit et la négociation des contrats de référencement ;","La rédaction et la négociation des contrats-cadres fournisseurs et des accords d'approvisionnement ;","L'organisation des relations entre la tête de réseau, les fournisseurs et les membres du réseau ;","La définition des obligations d'achat, des exclusivités et des conditions d'approvisionnement ;","L'encadrement des conditions tarifaires, remises, ristournes et autres avantages commerciaux ;","La formalisation des prestations de services et des contreparties contractuelles ;","L'analyse des obligations relatives à la négociation commerciale et aux conventions écrites ;","La gestion des difficultés d'approvisionnement et des différends avec les fournisseurs."]},{type:"paragraph",items:["Une attention particulière est portée à la cohérence des engagements entre les différents acteurs, à la transparence des conditions commerciales et à la prévention des risques liés aux pratiques restrictives de concurrence."]}],summary:"Organiser et sécuriser les relations d'achat et d'approvisionnement au sein des réseaux.",body:["L'organisation des achats et des approvisionnements constitue un enjeu contractuel et économique important pour de nombreux réseaux de distribution.","Selon le modèle retenu, elle peut reposer sur une centrale d'achat, une centrale de référencement, des accords conclus directement avec les fournisseurs ou une combinaison de ces dispositifs.","Le cabinet accompagne les entreprises dans :","La structuration juridique des centrales d'achat et des centrales de référencement ;","La définition des modalités de référencement et de sélection des fournisseurs ;","La rédaction, l'audit et la négociation des contrats de référencement ;","La rédaction et la négociation des contrats-cadres fournisseurs et des accords d'approvisionnement ;","L'organisation des relations entre la tête de réseau, les fournisseurs et les membres du réseau ;","La définition des obligations d'achat, des exclusivités et des conditions d'approvisionnement ;","L'encadrement des conditions tarifaires, remises, ristournes et autres avantages commerciaux ;","La formalisation des prestations de services et des contreparties contractuelles ;","L'analyse des obligations relatives à la négociation commerciale et aux conventions écrites ;","La gestion des difficultés d'approvisionnement et des différends avec les fournisseurs.","Une attention particulière est portée à la cohérence des engagements entre les différents acteurs, à la transparence des conditions commerciales et à la prévention des risques liés aux pratiques restrictives de concurrence."]},{title:"Organisation et fonctionnement des réseaux",blocks:[{type:"paragraph",items:["Au-delà des relations contractuelles avec chaque membre du réseau, le fonctionnement d'un réseau repose sur des règles communes, des outils partagés et une organisation permettant de coordonner les activités de ses différents membres."]},{type:"paragraph",items:["Le cabinet intervient notamment dans :"]},{type:"list",items:["L'élaboration et la révision des chartes de réseau ;","La formalisation des procédures et des documents contractuels applicables au réseau ;","L'encadrement des politiques commerciales, des opérations promotionnelles et des actions de communication communes ;","L'organisation des relations entre la tête de réseau et ses membres ;","L'analyse des obligations d'information, de reporting et de transmission des données ;","L'encadrement contractuel de l'accès, du partage et de l'utilisation des données commerciales, des données de vente et des fichiers clients ;","La définition des conditions d'utilisation des outils numériques et des systèmes d'information communs ;","L'audit des pratiques et des documents du réseau ;","L'accompagnement dans l'évolution et l'harmonisation des règles applicables aux membres du réseau."]},{type:"paragraph",items:["Ces interventions visent à assurer la cohérence entre les contrats, les documents internes et les pratiques opérationnelles, tout en tenant compte de l'autonomie juridique des membres du réseau et des règles de concurrence applicables."]}],summary:"Encadrer les pratiques du réseau et assurer la cohérence de son fonctionnement.",body:["Au-delà des relations contractuelles avec chaque membre du réseau, le fonctionnement d'un réseau repose sur des règles communes, des outils partagés et une organisation permettant de coordonner les activités de ses différents membres.","Le cabinet intervient notamment dans :","L'élaboration et la révision des chartes de réseau ;","La formalisation des procédures et des documents contractuels applicables au réseau ;","L'encadrement des politiques commerciales, des opérations promotionnelles et des actions de communication communes ;","L'organisation des relations entre la tête de réseau et ses membres ;","L'analyse des obligations d'information, de reporting et de transmission des données ;","L'encadrement contractuel de l'accès, du partage et de l'utilisation des données commerciales, des données de vente et des fichiers clients ;","La définition des conditions d'utilisation des outils numériques et des systèmes d'information communs ;","L'audit des pratiques et des documents du réseau ;","L'accompagnement dans l'évolution et l'harmonisation des règles applicables aux membres du réseau.","Ces interventions visent à assurer la cohérence entre les contrats, les documents internes et les pratiques opérationnelles, tout en tenant compte de l'autonomie juridique des membres du réseau et des règles de concurrence applicables."]},{title:"Évolution, rupture et différends au sein des réseaux",blocks:[{type:"paragraph",items:["Les réseaux de distribution évoluent au rythme des stratégies de développement, des transformations économiques et des relations entre leurs différents acteurs."]},{type:"paragraph",items:["Le cabinet accompagne les entreprises dans l'adaptation de leurs organisations contractuelles et la gestion des situations de désaccord ou de rupture."]},{type:"paragraph",items:["Les interventions comprennent notamment :"]},{type:"list",items:["La modification et la renégociation des contrats de distribution ;","L'accompagnement des projets de transformation ou de réorganisation des réseaux ;","L'analyse des conditions de renouvellement et de non-renouvellement des contrats ;","La préparation et la sécurisation des résiliations contractuelles ;","L'analyse des risques liés à la rupture brutale des relations commerciales établies ;","L'application et la contestation des clauses post-contractuelles, notamment de non-concurrence et de non-affiliation ;","L'organisation des conditions de sortie du réseau : utilisation des signes distinctifs, restitution des documents, sort des stocks et des données ;","La gestion des différends entre franchiseurs, franchisés, distributeurs, fournisseurs et autres partenaires ;","La négociation de solutions amiables et de protocoles transactionnels ;","L'accompagnement dans la gestion précontentieuse et contentieuse des différends."]},{type:"paragraph",items:["L'accompagnement tient compte des enjeux juridiques et économiques de la rupture, ainsi que de ses conséquences sur la continuité de l'activité et les autres membres du réseau."]}],summary:"Anticiper et maîtriser les conséquences juridiques de l'évolution ou de la cessation des relations commerciales.",body:["Les réseaux de distribution évoluent au rythme des stratégies de développement, des transformations économiques et des relations entre leurs différents acteurs.","Le cabinet accompagne les entreprises dans l'adaptation de leurs organisations contractuelles et la gestion des situations de désaccord ou de rupture.","Les interventions comprennent notamment :","La modification et la renégociation des contrats de distribution ;","L'accompagnement des projets de transformation ou de réorganisation des réseaux ;","L'analyse des conditions de renouvellement et de non-renouvellement des contrats ;","La préparation et la sécurisation des résiliations contractuelles ;","L'analyse des risques liés à la rupture brutale des relations commerciales établies ;","L'application et la contestation des clauses post-contractuelles, notamment de non-concurrence et de non-affiliation ;","L'organisation des conditions de sortie du réseau : utilisation des signes distinctifs, restitution des documents, sort des stocks et des données ;","La gestion des différends entre franchiseurs, franchisés, distributeurs, fournisseurs et autres partenaires ;","La négociation de solutions amiables et de protocoles transactionnels ;","L'accompagnement dans la gestion précontentieuse et contentieuse des différends.","L'accompagnement tient compte des enjeux juridiques et économiques de la rupture, ainsi que de ses conséquences sur la continuité de l'activité et les autres membres du réseau."]}]},{slug:"relations-commerciales",title:"Droit commercial et relations d'affaires",subtitle:"Sécuriser les relations commerciales et accompagner les entreprises dans leurs enjeux juridiques",intro:["Le cabinet accompagne les entreprises dans la sécurisation de leurs relations d'affaires, de la préparation des négociations commerciales à la gestion des différends.","Son intervention couvre notamment les relations fournisseurs-distributeurs, la conformité des pratiques commerciales entre professionnels, les baux commerciaux ainsi que la prévention et la gestion des ruptures de relations commerciales."],sections:[{title:"Relations fournisseurs-distributeurs et négociations commerciales",blocks:[{type:"paragraph",items:["Le cabinet accompagne les fournisseurs et distributeurs dans la préparation, la conduite et la formalisation de leurs négociations commerciales, en tenant compte du cadre réglementaire applicable et des enjeux propres à leurs relations."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["Les conditions générales de vente (CGV) : rédaction, audit, mise à jour et adaptation des CGV, qui constituent le socle de la négociation commerciale ;","Le calendrier des négociations commerciales : identification du régime juridique applicable, des échéances légales et des obligations à respecter tout au long du processus de négociation ;","La préparation et conduite des négociations : analyse des propositions commerciales, préparation des positions de négociation, examen des conditions d'achat et accompagnement dans les échanges entre fournisseurs et distributeurs ;","Les conventions commerciales : rédaction, audit et négociation des conventions annuelles ou pluriannuelles, de leurs avenants et des accords de coopération commerciale ;","Les lettres de réserves : rédaction et formalisation des réserves et désaccords sur les stipulations ou conditions proposées dans le cadre des négociations ;","L’équilibre des relations commerciales : analyse des remises, avantages commerciaux, services de coopération commerciale et contreparties au regard des règles applicables aux pratiques restrictives de concurrence."]}],summary:"Encadrer et sécuriser les négociations commerciales entre fournisseurs et distributeurs.",body:["Le cabinet accompagne les fournisseurs et distributeurs dans la préparation, la conduite et la formalisation de leurs négociations commerciales, en tenant compte du cadre réglementaire applicable et des enjeux propres à leurs relations.","Les interventions portent notamment sur :","Les conditions générales de vente (CGV) : rédaction, audit, mise à jour et adaptation des CGV, qui constituent le socle de la négociation commerciale ;","Le calendrier des négociations commerciales : identification du régime juridique applicable, des échéances légales et des obligations à respecter tout au long du processus de négociation ;","La préparation et conduite des négociations : analyse des propositions commerciales, préparation des positions de négociation, examen des conditions d'achat et accompagnement dans les échanges entre fournisseurs et distributeurs ;","Les conventions commerciales : rédaction, audit et négociation des conventions annuelles ou pluriannuelles, de leurs avenants et des accords de coopération commerciale ;","Les lettres de réserves : rédaction et formalisation des réserves et désaccords sur les stipulations ou conditions proposées dans le cadre des négociations ;","L’équilibre des relations commerciales : analyse des remises, avantages commerciaux, services de coopération commerciale et contreparties au regard des règles applicables aux pratiques restrictives de concurrence."]},{title:"Sécurisation des relations d'affaires et des pratiques commerciales",blocks:[{type:"paragraph",items:["Le cabinet intervient dans l'analyse et la sécurisation des pratiques commerciales entre professionnels, afin de prévenir les risques juridiques liés aux conditions de collaboration et à l'exécution des relations d'affaires."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["L’audit des pratiques commerciales : examen des pratiques et procédures internes, identification des risques juridiques et recommandations de mise en conformité ;","L’équilibre des relations commerciales : analyse des obligations réciproques, des avantages consentis et des situations susceptibles de caractériser un déséquilibre significatif ou un avantage sans contrepartie ;","La transparence commerciale : vérification des obligations applicables aux relations entre professionnels, notamment en matière de conditions de vente, de facturation et de délais de paiement ;","Les pratiques restrictives de concurrence : analyse des clauses et pratiques susceptibles de soulever des difficultés au regard des règles de concurrence, notamment en matière de fixation des prix de revente, de restrictions verticales et d'échanges d'informations commercialement sensibles ;","L’organisation des pratiques internes : adaptation des procédures commerciales et accompagnement dans la mise en œuvre des mesures correctives."]}],summary:"Prévenir les risques juridiques et assurer la conformité des pratiques commerciales entre professionnels.",body:["Le cabinet intervient dans l'analyse et la sécurisation des pratiques commerciales entre professionnels, afin de prévenir les risques juridiques liés aux conditions de collaboration et à l'exécution des relations d'affaires.","Les interventions portent notamment sur :","L’audit des pratiques commerciales : examen des pratiques et procédures internes, identification des risques juridiques et recommandations de mise en conformité ;","L’équilibre des relations commerciales : analyse des obligations réciproques, des avantages consentis et des situations susceptibles de caractériser un déséquilibre significatif ou un avantage sans contrepartie ;","La transparence commerciale : vérification des obligations applicables aux relations entre professionnels, notamment en matière de conditions de vente, de facturation et de délais de paiement ;","Les pratiques restrictives de concurrence : analyse des clauses et pratiques susceptibles de soulever des difficultés au regard des règles de concurrence, notamment en matière de fixation des prix de revente, de restrictions verticales et d'échanges d'informations commercialement sensibles ;","L’organisation des pratiques internes : adaptation des procédures commerciales et accompagnement dans la mise en œuvre des mesures correctives."]},{title:"Baux commerciaux",blocks:[{type:"paragraph",items:["Le cabinet accompagne les bailleurs et preneurs dans la négociation et la conclusion de leurs baux commerciaux, en tenant compte des contraintes liées à l'exploitation des locaux."]},{type:"paragraph",items:["Les interventions portent notamment sur la rédaction, l'analyse et la négociation des stipulations contractuelles relatives à la destination des locaux, à la durée du bail, aux loyers, aux charges, aux travaux et aux garanties."]}],summary:"Sécuriser les engagements locatifs et les conditions d'exploitation des locaux commerciaux.",body:["Le cabinet accompagne les bailleurs et preneurs dans la négociation et la conclusion de leurs baux commerciaux, en tenant compte des contraintes liées à l'exploitation des locaux.","Les interventions portent notamment sur la rédaction, l'analyse et la négociation des stipulations contractuelles relatives à la destination des locaux, à la durée du bail, aux loyers, aux charges, aux travaux et aux garanties."]},{title:"Rupture des relations commerciales établies",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises dans l'anticipation et la gestion de la cessation de leurs relations commerciales, afin d'en sécuriser les modalités et de prévenir les risques de responsabilité liés à une rupture brutale."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["L’analyse de la relation commerciale : appréciation de son caractère établi, de sa durée, de son évolution et des circonstances de la rupture envisagée ;","Le préavis de rupture : analyse des obligations applicables et appréciation de la durée et des modalités du préavis au regard des caractéristiques de la relation ;","La préparation de la rupture : définition des conditions de cessation de la relation, rédaction des notifications et accompagnement dans les échanges avec le partenaire commercial ;","La prévention des risques de rupture brutale : identification des situations susceptibles d'engager la responsabilité de l'entreprise et évaluation de leurs conséquences juridiques ;","La gestion des ruptures contestées : analyse des réclamations, préparation des réponses et négociation des conditions de sortie ; ","Les accords de résiliation : rédaction et négociation des protocoles organisant la cessation des relations commerciales et le règlement des obligations réciproques."]}],summary:"Anticiper et maîtriser les risques liés à la cessation des relations commerciales.",body:["Le cabinet accompagne les entreprises dans l'anticipation et la gestion de la cessation de leurs relations commerciales, afin d'en sécuriser les modalités et de prévenir les risques de responsabilité liés à une rupture brutale.","Les interventions portent notamment sur :","L’analyse de la relation commerciale : appréciation de son caractère établi, de sa durée, de son évolution et des circonstances de la rupture envisagée ;","Le préavis de rupture : analyse des obligations applicables et appréciation de la durée et des modalités du préavis au regard des caractéristiques de la relation ;","La préparation de la rupture : définition des conditions de cessation de la relation, rédaction des notifications et accompagnement dans les échanges avec le partenaire commercial ;","La prévention des risques de rupture brutale : identification des situations susceptibles d'engager la responsabilité de l'entreprise et évaluation de leurs conséquences juridiques ;","La gestion des ruptures contestées : analyse des réclamations, préparation des réponses et négociation des conditions de sortie ; ","Les accords de résiliation : rédaction et négociation des protocoles organisant la cessation des relations commerciales et le règlement des obligations réciproques."]},{title:"Prévention et résolution des différends commerciaux",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises dans la prévention et la gestion des différends survenant dans leurs relations d'affaires, en privilégiant, lorsque cela est pertinent, la recherche de solutions amiables permettant de préserver leurs intérêts."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["L’analyse des différends : examen des faits, des engagements contractuels et des responsabilités susceptibles d'être engagées ;","L’évaluation des risques : analyse des fondements juridiques des réclamations et des conséquences possibles du différend ;","La gestion des réclamations : rédaction et réponse aux mises en demeure, contestations et demandes formulées par les partenaires commerciaux ;","La négociation amiable : accompagnement dans les échanges et la recherche de solutions négociées ;","Les protocoles transactionnels : rédaction et négociation des accords destinés à mettre fin aux différends et à sécuriser les engagements des parties ;","La gestion précontentieuse et contentieuse : accompagnement dans la préparation et le suivi des différends commerciaux nécessitant une procédure judiciaire."]}],summary:"Définir une stratégie adaptée pour prévenir et résoudre les différends entre partenaires commerciaux.",body:["Le cabinet accompagne les entreprises dans la prévention et la gestion des différends survenant dans leurs relations d'affaires, en privilégiant, lorsque cela est pertinent, la recherche de solutions amiables permettant de préserver leurs intérêts.","Les interventions portent notamment sur :","L’analyse des différends : examen des faits, des engagements contractuels et des responsabilités susceptibles d'être engagées ;","L’évaluation des risques : analyse des fondements juridiques des réclamations et des conséquences possibles du différend ;","La gestion des réclamations : rédaction et réponse aux mises en demeure, contestations et demandes formulées par les partenaires commerciaux ;","La négociation amiable : accompagnement dans les échanges et la recherche de solutions négociées ;","Les protocoles transactionnels : rédaction et négociation des accords destinés à mettre fin aux différends et à sécuriser les engagements des parties ;","La gestion précontentieuse et contentieuse : accompagnement dans la préparation et le suivi des différends commerciaux nécessitant une procédure judiciaire."]}]},{slug:"consommation",title:"Droit de la consommation et pratiques commerciales",subtitle:"Sécuriser les pratiques commerciales et assurer leur conformité au droit de la consommation",intro:["Le cabinet accompagne les entreprises dans la mise en conformité de leurs pratiques de vente et de leurs documents contractuels avec les exigences du droit de la consommation.","Son intervention couvre notamment l'information des consommateurs, les conditions générales de vente BtoC, les pratiques publicitaires et promotionnelles ainsi que l'accompagnement lors des contrôles des autorités administratives."],sections:[{title:"Conformité des ventes aux consommateurs et documentation contractuelle",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises dans la sécurisation de leurs pratiques de vente et de leurs documents contractuels, en magasin comme à distance, afin de prévenir les risques de non-conformité au droit de la consommation."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["L’audit de conformité : analyse des pratiques de vente, des parcours d'achat et des documents contractuels au regard des exigences du droit de la consommation ;","Les conditions générales de vente BtoC : rédaction, audit et mise à jour des CGV applicables aux ventes de produits et aux prestations de services, adaptées à l'activité et aux différents canaux de commercialisation ;","L’information précontractuelle : vérification des obligations d'information relatives aux caractéristiques essentielles des produits et services, aux prix et aux conditions de vente ;","Le droit de rétractation : analyse des obligations applicables aux ventes à distance et hors établissement, notamment concernant l'information des consommateurs, les modalités d'exercice du droit de rétractation et les documents correspondants ;","Les garanties légales : vérification du respect des obligations relatives à la garantie légale de conformité et à la garantie des vices cachés, et adaptation des stipulations contractuelles ;","Les clauses abusives : identification et modification des stipulations susceptibles de créer un déséquilibre significatif au détriment du consommateur."]}],summary:"Sécuriser les pratiques de vente et les obligations contractuelles envers les consommateurs.",body:["Le cabinet accompagne les entreprises dans la sécurisation de leurs pratiques de vente et de leurs documents contractuels, en magasin comme à distance, afin de prévenir les risques de non-conformité au droit de la consommation.","Les interventions portent notamment sur :","L’audit de conformité : analyse des pratiques de vente, des parcours d'achat et des documents contractuels au regard des exigences du droit de la consommation ;","Les conditions générales de vente BtoC : rédaction, audit et mise à jour des CGV applicables aux ventes de produits et aux prestations de services, adaptées à l'activité et aux différents canaux de commercialisation ;","L’information précontractuelle : vérification des obligations d'information relatives aux caractéristiques essentielles des produits et services, aux prix et aux conditions de vente ;","Le droit de rétractation : analyse des obligations applicables aux ventes à distance et hors établissement, notamment concernant l'information des consommateurs, les modalités d'exercice du droit de rétractation et les documents correspondants ;","Les garanties légales : vérification du respect des obligations relatives à la garantie légale de conformité et à la garantie des vices cachés, et adaptation des stipulations contractuelles ;","Les clauses abusives : identification et modification des stipulations susceptibles de créer un déséquilibre significatif au détriment du consommateur."]},{title:"Publicité, promotions et pratiques commerciales déloyales",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises dans la sécurisation juridique de leurs communications commerciales et opérations promotionnelles, afin de prévenir les risques liés aux pratiques commerciales trompeuses, agressives ou déloyales."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["La publicité et la communication commerciale : analyse de la conformité des messages publicitaires, des allégations commerciales et des supports de communication ;","Les opérations promotionnelles : sécurisation des offres promotionnelles, ventes avec avantages, opérations commerciales et conditions de participation ;","Les annonces de réduction de prix : vérification des règles applicables aux prix de référence, aux remises annoncées et à leur présentation aux consommateurs ;","Les pratiques commerciales trompeuses ou agressives : identification des risques liés aux informations communiquées, aux omissions et aux procédés commerciaux utilisés ;","La publicité comparative : analyse des conditions de licéité des communications comparant des produits, services ou entreprises ;","La communication d'influence : examen des obligations applicables aux collaborations avec les influenceurs et à la présentation des communications commerciales."]}],summary:"Assurer la conformité des communications commerciales et des opérations promotionnelles.",body:["Le cabinet accompagne les entreprises dans la sécurisation juridique de leurs communications commerciales et opérations promotionnelles, afin de prévenir les risques liés aux pratiques commerciales trompeuses, agressives ou déloyales.","Les interventions portent notamment sur :","La publicité et la communication commerciale : analyse de la conformité des messages publicitaires, des allégations commerciales et des supports de communication ;","Les opérations promotionnelles : sécurisation des offres promotionnelles, ventes avec avantages, opérations commerciales et conditions de participation ;","Les annonces de réduction de prix : vérification des règles applicables aux prix de référence, aux remises annoncées et à leur présentation aux consommateurs ;","Les pratiques commerciales trompeuses ou agressives : identification des risques liés aux informations communiquées, aux omissions et aux procédés commerciaux utilisés ;","La publicité comparative : analyse des conditions de licéité des communications comparant des produits, services ou entreprises ;","La communication d'influence : examen des obligations applicables aux collaborations avec les influenceurs et à la présentation des communications commerciales."]},{title:"Contrôles DGCCRF et DDPP",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises dans la préparation et le suivi des contrôles réalisés par les autorités administratives compétentes en matière de consommation et de pratiques commerciales."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["La préparation aux contrôles : audit des documents, procédures et pratiques commerciales afin d'identifier les risques de non-conformité ;","L’accompagnement lors des contrôles : assistance dans les échanges avec la DGCCRF et les DDPP et dans la communication des documents et informations demandés ;","L’analyse des observations : examen des constats, demandes de régularisation et mesures envisagées par les autorités ;","La préparation des réponses : rédaction des observations et réponses aux demandes des autorités administratives ;","La mise en conformité : définition et mise en œuvre des mesures correctives relatives aux documents contractuels, aux pratiques de vente et aux communications commerciales ;","La prévention des risques : adaptation des procédures internes et sensibilisation des équipes aux obligations réglementaires applicables."]}],summary:"Anticiper les contrôles administratifs et accompagner les entreprises dans leurs échanges avec les autorités.",body:["Le cabinet accompagne les entreprises dans la préparation et le suivi des contrôles réalisés par les autorités administratives compétentes en matière de consommation et de pratiques commerciales.","Les interventions portent notamment sur :","La préparation aux contrôles : audit des documents, procédures et pratiques commerciales afin d'identifier les risques de non-conformité ;","L’accompagnement lors des contrôles : assistance dans les échanges avec la DGCCRF et les DDPP et dans la communication des documents et informations demandés ;","L’analyse des observations : examen des constats, demandes de régularisation et mesures envisagées par les autorités ;","La préparation des réponses : rédaction des observations et réponses aux demandes des autorités administratives ;","La mise en conformité : définition et mise en œuvre des mesures correctives relatives aux documents contractuels, aux pratiques de vente et aux communications commerciales ;","La prévention des risques : adaptation des procédures internes et sensibilisation des équipes aux obligations réglementaires applicables."]}]},{slug:"numerique-donnees",title:"Droit du numérique et protection des données",subtitle:"Sécuriser les projets numériques et accompagner les entreprises dans leur conformité réglementaire",intro:["Le cabinet accompagne les entreprises dans la sécurisation juridique de leurs projets numériques, de la négociation des contrats informatiques à la protection des données personnelles.","Son intervention couvre notamment les contrats de développement, de licence et de services informatiques, les solutions SaaS ainsi que la mise en conformité des traitements de données personnelles avec le RGPD."],sections:[{title:"Contrats informatiques et solutions numériques",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises, qu'elles soient clientes ou prestataires, dans la rédaction, la négociation et la sécurisation de leurs contrats informatiques, en tenant compte des enjeux opérationnels, techniques et économiques de leurs projets."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["Les contrats informatiques : rédaction, audit et négociation des contrats de développement logiciel, de licence, de maintenance, d'hébergement, d'infogérance et de prestations informatiques ;","Les contrats SaaS : rédaction et négociation des conditions générales d'abonnement et des contrats de services SaaS, notamment concernant les niveaux de service (SLA), les garanties et les engagements des prestataires ; ","La sécurisation des projets informatiques : encadrement contractuel du périmètre des prestations, des livrables, des délais, des procédures de recette et des modalités de gestion des évolutions du projet ;","Les responsabilités et garanties : analyse et négociation des clauses relatives aux obligations des parties, aux garanties, aux limitations de responsabilité et aux conséquences des manquements contractuels ;","La réversibilité et fin de contrat : encadrement des conditions de résiliation, de restitution ou de récupération des données, de réversibilité et de continuité des services."]}],summary:"Sécuriser les engagements contractuels et accompagner la réalisation des projets informatiques.",body:["Le cabinet accompagne les entreprises, qu'elles soient clientes ou prestataires, dans la rédaction, la négociation et la sécurisation de leurs contrats informatiques, en tenant compte des enjeux opérationnels, techniques et économiques de leurs projets.","Les interventions portent notamment sur :","Les contrats informatiques : rédaction, audit et négociation des contrats de développement logiciel, de licence, de maintenance, d'hébergement, d'infogérance et de prestations informatiques ;","Les contrats SaaS : rédaction et négociation des conditions générales d'abonnement et des contrats de services SaaS, notamment concernant les niveaux de service (SLA), les garanties et les engagements des prestataires ; ","La sécurisation des projets informatiques : encadrement contractuel du périmètre des prestations, des livrables, des délais, des procédures de recette et des modalités de gestion des évolutions du projet ;","Les responsabilités et garanties : analyse et négociation des clauses relatives aux obligations des parties, aux garanties, aux limitations de responsabilité et aux conséquences des manquements contractuels ;","La réversibilité et fin de contrat : encadrement des conditions de résiliation, de restitution ou de récupération des données, de réversibilité et de continuité des services."]},{title:"Protection des données personnelles et conformité RGPD",blocks:[{type:"paragraph",items:["Le cabinet accompagne les entreprises dans l'analyse et la mise en conformité de leurs pratiques de traitement des données personnelles, afin de répondre aux exigences du RGPD et de la loi Informatique et Libertés."]},{type:"paragraph",items:["Les interventions portent notamment sur :"]},{type:"list",items:["L’audit de conformité RGPD : analyse des traitements de données personnelles, identification des risques de non-conformité et définition des mesures correctives ;","La documentation RGPD : assistance à l'élaboration et à la mise à jour du registre des traitements, rédaction des politiques de confidentialité, des mentions d'information et des procédures internes ;","Les droits des personnes concernées : accompagnement dans la mise en place des procédures permettant de répondre aux demandes d'accès, de rectification, d'effacement et d'exercice des autres droits prévus par le RGPD ;","Les contrats de sous-traitance (DPA) : rédaction, audit et négociation des accords de traitement des données personnelles, notamment concernant les obligations respectives des parties, les mesures de sécurité, le recours aux sous-traitants ultérieurs et les conditions de restitution ou de suppression des données ;","Les cookies et traceurs : analyse des dispositifs de collecte du consentement et mise en conformité des informations communiquées aux utilisateurs."]}],summary:"Encadrer les traitements de données personnelles et accompagner la mise en conformité au RGPD.",body:["Le cabinet accompagne les entreprises dans l'analyse et la mise en conformité de leurs pratiques de traitement des données personnelles, afin de répondre aux exigences du RGPD et de la loi Informatique et Libertés.","Les interventions portent notamment sur :","L’audit de conformité RGPD : analyse des traitements de données personnelles, identification des risques de non-conformité et définition des mesures correctives ;","La documentation RGPD : assistance à l'élaboration et à la mise à jour du registre des traitements, rédaction des politiques de confidentialité, des mentions d'information et des procédures internes ;","Les droits des personnes concernées : accompagnement dans la mise en place des procédures permettant de répondre aux demandes d'accès, de rectification, d'effacement et d'exercice des autres droits prévus par le RGPD ;","Les contrats de sous-traitance (DPA) : rédaction, audit et négociation des accords de traitement des données personnelles, notamment concernant les obligations respectives des parties, les mesures de sécurité, le recours aux sous-traitants ultérieurs et les conditions de restitution ou de suppression des données ;","Les cookies et traceurs : analyse des dispositifs de collecte du consentement et mise en conformité des informations communiquées aux utilisateurs."]}]},{slug:"accompagnement-juridique",title:"Direction juridique externalisée et accompagnement sur mesure",subtitle:"Une expertise juridique intégrée à votre organisation, selon vos besoins",intro:["Les interventions peuvent être ponctuelles ou régulières, en autonomie ou en collaboration étroite avec les dirigeants, les directions juridiques et les équipes opérationnelles, avec une approche à la fois stratégique et opérationnelle."],sections:[{title:"Direction juridique à temps partagé",summary:"Prise en charge à temps partagé de la fonction juridique de l'entreprise : coordination des sujets juridiques, accompagnement des décisions stratégiques, sécurisation des opérations et appui aux dirigeants et aux équipes.",body:[],blocks:[]},{title:"Conseil juridique externalisé",summary:"Accompagnement juridique dans la durée, en qualité d'interlocuteur de référence, pour traiter les problématiques courantes, anticiper les risques et sécuriser les décisions et les relations d'affaires.",body:[],blocks:[]},{title:"Renfort juridique ponctuel",summary:"Intervention en appui des directions juridiques ou des équipes opérationnelles pour répondre à un besoin temporaire, absorber un surcroît d'activité ou apporter une expertise sur un sujet déterminé.",body:[],blocks:[]},{title:"Pilotage juridique de projets",summary:"Prise en charge ou coordination du volet juridique de projets structurants : développement ou réorganisation de réseaux, évolution des modèles de distribution, négociations contractuelles complexes ou déploiement de nouveaux dispositifs contractuels.",body:[],blocks:[]}]}],VA=["Un accompagnement juridique pensé pour les enjeux de votre activité","Nous accompagnons les entreprises dans la structuration et le développement de leurs activités : négociation contractuelle, organisation des réseaux de distribution, relations commerciales et droit de la consommation.","Notre approche associe vision stratégique, maîtrise des risques et compréhension concrète des réalités opérationnelles de l'entreprise."],IA=["Avocate au Barreau de Paris et ancienne directrice juridique, Haia El Zufari accompagne les entreprises en droit des contrats, de la distribution et de la consommation.","Son parcours de plus de quinze années en entreprise, d'abord comme juriste d'affaires puis comme directrice juridique, lui a permis de développer une connaissance approfondie des enjeux juridiques, économiques et opérationnels des entreprises.","Elle a exercé au sein d'entreprises de taille intermédiaire, notamment dans des contextes de croissance et de transformation, dans des secteurs variés : textile, restauration, exploitation cinématographique et salles de sport.","Cette expérience, acquise au cœur de l'opérationnel et de la gouvernance, nourrit aujourd'hui une pratique du droit fondée sur la compréhension des enjeux de l'entreprise, l'anticipation des risques et la recherche de solutions fiables, concrètes et directement opérationnelles."],GA="Une approche ancrée dans la réalité de l'entreprise",HA="Une démarche qui associe expertise juridique, compréhension des enjeux opérationnels et relation de confiance.",WA=[{title:"Une expertise juridique et opérationnelle",text:"Une expérience acquise au sein de l'entreprise, permettant d'appréhender les problématiques juridiques dans leur environnement économique et organisationnel, et d'intégrer les contraintes propres aux différents métiers."},{title:"Une approche pragmatique",text:"Des analyses juridiques mises en perspective avec les objectifs, les priorités et les contraintes de l'entreprise, afin de proposer des solutions fiables, concrètes et directement opérationnelles."},{title:"Une relation de confiance",text:"Un accompagnement fondé sur l'écoute, la transparence et la proximité, avec une attention particulière portée à la compréhension des besoins, à l'anticipation des risques et à la qualité des échanges."}],DA=[{title:"Authenticité",text:"Une relation directe et des échanges clairs, sans jargon inutile."},{title:"Confiance",text:"Une relation fondée sur la loyauté, la transparence et le respect des engagements."},{title:"Proximité",text:"Une compréhension des réalités de l'entreprise et une attention portée à ses enjeux quotidiens."},{title:"Excellence",text:"Une exigence constante de rigueur et de qualité, dans l'analyse comme dans les solutions proposées."}],MA=["Des honoraires adaptés à la nature et aux enjeux de chaque mission","Les modalités d'intervention et les honoraires sont définis en amont, dans un souci de transparence et de prévisibilité.","Les honoraires sont déterminés notamment en fonction de la nature et de la complexité du dossier, du temps consacré à la mission, des diligences à accomplir et des enjeux du dossier.","Trois modes de facturation peuvent être proposés","Forfait","Un montant défini à l'avance pour une mission ou des prestations déterminées, pouvant, le cas échéant, être complété par un honoraire de résultat.","Temps passé","Une facturation établie sur la base d'un taux horaire convenu préalablement, en fonction du temps consacré au dossier.","Abonnement","Une formule adaptée aux entreprises souhaitant bénéficier d'un accompagnement juridique régulier, selon un périmètre et des modalités définis ensemble.","Les conditions financières de l'intervention sont formalisées dans une convention d'honoraires, conformément aux règles applicables à la profession d'avocat.","Les frais et débours éventuels, notamment les frais de déplacement, d'expertise ou d'intervention de tiers, font l'objet d'une information distincte."],ut={pages:FA,home:VA,bio:IA,approachTitle:GA,approachIntro:HA,approach:WA,values:DA,fees:MA},CA=[{title:"Sécuriser vos contrats",description:"De la négociation à l’exécution, anticiper les risques et maîtriser les engagements contractuels.",label:"Droit des contrats",link:"/contrats"},{title:"Structurer et développer votre réseau de distribution",description:"Concevoir, organiser et faire évoluer les réseaux et leurs relations avec les partenaires.",label:"Droit de la distribution et des réseaux",link:"/reseaux-distribution"},{title:"Sécuriser vos relations commerciales",description:"Encadrer les négociations, les pratiques commerciales et les relations d’affaires, de leur développement à leur rupture.",label:"Droit commercial et relations d'affaires",link:"/relations-commerciales"},{title:"Encadrer vos pratiques envers les consommateurs",description:"Assurer la conformité des ventes, des communications commerciales et des opérations promotionnelles.",label:"Droit de la consommation et pratiques commerciales",link:"/consommation"},{title:"Sécuriser vos projets numériques et vos données",description:"Encadrer les contrats et solutions numériques et accompagner la conformité en matière de protection des données personnelles.",label:"Droit du numérique et protection des données",link:"/numerique-donnees"},{title:"Intégrer une expertise juridique à votre organisation",description:"Bénéficier d’un appui juridique ponctuel ou régulier, en autonomie ou aux côtés de vos équipes, selon les besoins de votre organisation.",label:"Direction juridique externalisée et accompagnement sur mesure",link:"/accompagnement-juridique"}],zA={text_001:"AUDESTYA · AVOCAT AU BARREAU DE PARIS",text_002:"Cabinet d’avocat dédié au droit de la ",text_003:"distribution, des contrats et de la consommation.",text_004:"Sécuriser un contrat, développer votre réseau ou encadrer vos pratiques commerciales : un accompagnement juridique concret, au service de vos décisions et de votre activité.",text_005:"Parlons de votre besoin ",text_006:"Découvrir les expertises ",text_007:"Clarté. Méthode. Exigence.",text_008:"Une approche juridique alignée sur vos enjeux."},BA={text_001:"Contact ",text_002:"AUDESTYA",text_003:"AVOCAT"},EA={text_001:"AUDESTYA",text_002:"AVOCAT",text_003:"Haia EL ZUFARI",text_004:"Avocat au Barreau de Paris",text_005:"Navigation",text_006:"Accueil",text_007:"Le cabinet",text_008:"Direction juridique externalisée",text_009:"Expertises",text_010:"Actualités",text_011:"Contact",text_012:"Honoraires",text_013:"Contact",text_016:"Paris - France",text_017:"© 2025 Audestya Avocat. Tous droits réservés.",text_018:"Mentions légales",text_019:"Cookies",text_020:"Politique de confidentialité"},LA={text_001:"UN PREMIER ÉCHANGE",text_002:"Échangeons sur vos besoins juridiques",text_003:"Un premier échange de 15 minutes pour présenter votre situation, préciser vos besoins et envisager les modalités d'accompagnement du cabinet.",text_004:"Pour convenir d'un échange, contactez directement le cabinet par email, téléphone ou SMS.",text_007:"Appel",text_008:" ou ",text_009:"SMS "},JA={text_001:"LE CABINET",text_002:"Haia El Zufari",text_003:"Avocate au Barreau de Paris",text_004:"Parcours et formation",text_005:"Principaux domaines d’intervention",text_006:"Droit des contrats • Droit de la distribution et des réseaux • Droit de la consommation et pratiques commerciales",text_007:"Inscription au Barreau",text_008:"Barreau de Paris — 2025",text_009:"Formation",text_010:"Master II Droit européen des affaires",text_011:"Université Paris XI – Jean Monnet",text_012:"Maîtrise Droit européen et international",text_013:"Université Paris II – Panthéon-Assas",text_014:"Langues",text_015:"Français • Anglais • Arabe",text_016:"Les valeurs du cabinet",text_017:"Domaines d’expertise ↗"},QA={text_001:"HONORAIRES"},YA={text_001:"Prendre contact ",text_002:"LES EXPERTISES",text_003:"Domaines d’expertise",text_004:"0",text_005:"Découvrir l’expertise",text_006:"← Toutes les expertises",text_007:"0",text_008:"En savoir plus",text_009:"Réduire",text_010:"Échanger sur ce besoin ",text_011:"0",text_012:"EXPERTISE SUIVANTE"},ZA={text_001:"ANALYSES & PUBLICATIONS",text_002:"Actualités et articles.",text_003:"Les analyses du cabinet et les publications partagées sur LinkedIn.",text_004:"Chargement des publications…",text_005:"Les publications sont momentanément indisponibles. Vous pouvez les retrouver sur LinkedIn.",text_006:"Retrouvez les dernières publications sur LinkedIn.",text_007:"Les articles du cabinet seront également disponibles ici.",text_008:"Lire la publication ",text_009:" Toutes les publications sur LinkedIn "},XA={text_001:"Politique de confidentialité",text_002:"La présente politique de confidentialité a pour objet de vous donner une meilleure visibilité sur le traitement de vos données à caractère personnel (ci-après les « Données »). Il est rappelé que, conformément au règlement (UE) 2016/679 du 27 avril 2016 (ci-après le « RGPD ») et à la loi n° 78-17 du 6 janvier 1978 relative à l’informatique, aux fichiers et aux libertés, une Donnée est toute information relative à une personne physique susceptible d'être identifiée, directement ou indirectement.",text_003:"La présente politique s’applique :",text_004:"Aux clients, prospects ou tout autre contact externe ;",text_005:"Aux visiteurs du site www.audestya-avocat.com (ci-après le « Site »).",text_006:"1. Qui est le responsable de traitement ?",text_007:"Haia El Zufari",text_008:"Entrepreneur individuel",text_009:"Avocate au Barreau de Paris",text_010:"Numéro SIREN : 943 937 789",text_011:"2. Comment les Données sont-elles collectées ?",text_012:"Je suis amenée à collecter des Données :",text_013:"Lorsque vous êtes un prospect ou un client potentiel et que vous me contactez directement (par courrier électronique, téléphone ou lors d'un rendez-vous) pour demander des informations ou des conseils ;",text_014:"Lorsque vous êtes client, notamment dans le cadre de la conclusion de la convention d’honoraires et de l’exécution des missions confiées et de tout échange y afférent ;",text_015:"Lorsque vous êtes un partenaire (expert, prestataire, confrère, etc.) avec qui je suis amenée à collaborer, dans le cadre de mon activité et des missions confiées ;",text_016:"Lorsque vous naviguez sur mon Site via les cookies et autres traceurs.",text_017:"3. Quelles sont les Données collectées ?",text_018:"Je collecte et traite notamment :",text_019:"Lors de la prise de contact directe : des Données d'identification du prospect ou du client potentiel qui demande des informations (nom, prénom, adresse électronique, numéro de téléphone, ou toute information spontanément transmise dans votre demande).",text_020:"Dans le cadre de l'exécution de ma mission : des Données d'identification des clients (y compris leurs salariés, représentants ou dirigeants) ainsi que les Données nécessaires à l'exécution de la mission (nom, prénom, adresse, adresse électronique, numéro de téléphone, coordonnées bancaires, date de naissance, pièces d'identité, éléments liés au dossier juridique).",text_021:"Les Données de navigation des visiteurs du Site : collectées automatiquement de manière technique par l’hébergeur (adresse IP, journaux de sécurité) et, sous réserve de votre consentement, par les outils d'analyse (données comportementales, identifiants de navigation).",text_022:"4. Pour quelles finalités sont collectées vos Données ?",text_023:"Vos Données peuvent être traitées pour les finalités suivantes :",text_024:"Si vous êtes un prospect ou un client potentiel : pour répondre à vos demandes directes d’information ou de prise de contact. Ce traitement repose sur l’exécution de mesures précontractuelles prises à votre demande (article 6.1 b du RGPD).",text_025:"Si vous êtes un client : pour (i) l’exécution de la relation contractuelle, sur le fondement de l’exécution du contrat (article 6.1 b du RGPD), et (ii) le respect de mes obligations légales, comptables, fiscales et déontologiques (article 6.1 c du RGPD), notamment pour le traitement des demandes, l’exécution des missions, la gestion de la convention d’honoraires, des factures, de la comptabilité et, plus généralement, le suivi de la relation contractuelle et (iii) le respect de mes obligations de vigilance en matière de lutte contre le blanchiment des capitaux et le financement du terrorisme (article 6.1 c du RGPD).",text_026:"Si vous êtes un partenaire (expert, prestataire, confrère, etc.) : pour (i) la gestion de mon activité et (ii) l’exécution des missions confiées par mes clients, sur le fondement de mon intérêt légitime à organiser mes relations professionnelles et à mener à bien ces missions (article 6.1 f du RGPD), ainsi que pour (iii) le respect de mes obligations légales, comptables, fiscales et déontologiques (article 6.1 c du RGPD).",text_027:"Si vous naviguez sur le Site : pour (i) assurer la sécurité informatique et l’affichage du Site, sur le fondement de mon intérêt légitime à mettre à disposition un site fonctionnel et sécurisé (article 6.1 f du RGPD) ; et, uniquement sous réserve de votre consentement (article 6.1 a du RGPD et article 82 de la loi n° 78-17 du 6 janvier 1978), pour (ii) analyser le trafic du Site (Google Analytics) et (iii) mesurer l’efficacité de mes campagnes publicitaires (Google Ads).",text_028:"5. Avec qui vos Données sont-elles partagées ?",text_029:"Dans la limite des finalités et des traitements définis à l’article 4, je peux être amenée à partager vos Données :",text_030:"Avec des partenaires avec votre consentement explicite.",text_031:"Avec des prestataires techniques : notamment hébergeur, prestataires informatiques, dans le cadre de l’exécution de mes services et l’exercice de mon activité.",text_032:"Aux autorités compétentes, dans les cas prévus par la loi et dans les limites du secret professionnel de l’avocat.",text_033:"Vos Données peuvent également être communiquées, dans les mêmes limites, pour respecter mes obligations légales ou pour protéger les droits, l’intégrité physique, la sécurité ou la sûreté des personnes.",text_034:"6. Quelle est la durée de conservation de vos Données ?",text_035:"Pour les clients et les partenaires, les Données sont conservées pendant toute la durée de la relation contractuelle puis pendant toute la durée de prescription légale, soit cinq (5) ans, qui court à compter du dernier échange avec la personne concernée.",text_036:"Les Données nécessaires à la comptabilité sont, quant à elles, conservées pendant la durée légale de conservation, soit dix (10) ans, pour respecter les obligations comptables et fiscales applicables.",text_037:"Les Données des prospects et des clients potentiels sont conservées pendant une durée de trois (3) ans suivant le dernier contact établi avec la personne concernée.",text_038:"Les documents et informations recueillis au titre de mes obligations de vigilance sont conservés pendant cinq (5) ans à compter de la cessation de la relation d’affaires.",text_039:"7. Vos Données sont-elles transférées en dehors de l’Union Européenne ?",text_040:"Oui, certains traitements de données entraînent des flux en dehors de l’Espace Économique Européen (EEE) :",text_041:"Hébergement du site (GitHub Pages) : L'affichage du site implique le traitement technique de votre adresse IP par GitHub, Inc. sur des serveurs principalement situés aux États-Unis. Ce transfert est encadré par le Data Privacy Framework et les Clauses Contractuelles Types (CCT) incluses dans le GitHub Data Protection Agreement.",text_042:"Gestion des contenus (Supabase) : Les comptes administrateurs, les articles et les images du CMS sont stockés physiquement dans un projet Supabase situé en France (Paris). Toutefois, l'administration de la plateforme et certains sous-traitants techniques peuvent impliquer des transferts hors UE, sécurisés par le Supabase Data Processing Addendum.",text_043:"Mesure d'audience et Publicité (Google Analytics & Google Ads) : Sous réserve de votre consentement préalable (via le bandeau de cookies), j’utilise les services de Google pour analyser les visites (Google Analytics) et mesurer l'efficacité de mes campagnes (Google Ads). Ces services impliquent le dépôt de cookies et le traitement d'identifiants de navigation transférés vers les États-Unis. Ces flux sont encadrés par les Conditions de traitement des données de Google et le Data Privacy Framework. Vous pouvez retirer votre consentement à tout moment.",text_044:"Réseaux sociaux (LinkedIn) : les publications LinkedIn intégrées au Site ne chargent aucun script et n’entraînent aucune transmission de Données à LinkedIn tant que vous ne les avez pas activées. Après une activation volontaire de votre part, LinkedIn traite des Données vous concernant (notamment votre adresse IP et des identifiants de navigation) et peut déposer ses propres cookies. Ces Données peuvent être transférées vers les États-Unis. LinkedIn est responsable des traitements qu’il effectue ensuite ; je vous invite à consulter sa politique de confidentialité.",text_045:"8. Quels sont vos droits ?",text_046:"Conformément à la réglementation en vigueur, vous disposez des droits suivants :",text_047:"Le droit d’accès : Vous avez le droit (i) d'obtenir la confirmation que des Données vous concernant sont ou ne sont pas traitées et, lorsqu'elles le sont, (ii) d'obtenir l'accès auxdites Données et une copie de ces dernières.",text_048:"Le droit de rectification : Vous avez le droit d'obtenir la rectification des Données vous concernant qui sont inexactes ou incomplètes.",text_049:"Le droit à l’effacement : Vous avez le droit d’obtenir l’effacement de vos Données. Je me réserve néanmoins la possibilité pour des raisons légales ou légitimes de conserver ces Données.",text_050:"Le droit à la limitation du traitement : Dans certains cas, vous avez le droit d'obtenir la limitation du traitement de vos Données.",text_051:"Le droit à la portabilité : Vous pouvez demander à recevoir vos Données vous concernant dans un format structuré, couramment utilisé et lisible par machine.",text_052:"Le droit d’opposition : Vous avez le droit de vous opposer à tout moment, pour des raisons tenant à votre situation particulière, à un traitement de Données vous concernant lorsque vos intérêts ou libertés et droits fondamentaux exigent une protection. Je me réserve néanmoins la possibilité d’invoquer des motifs légitimes et impérieux nécessitant la poursuite du traitement. Il en va de même aux fins de constatation, d'exercice ou de défense de droits en justice.",text_053:"Pour exercer ces droits, vous pouvez adresser une demande, par courriel à : dp@audestya-avocat.com. En cas de difficulté en lien avec la gestion des Données, vous pouvez adresser une réclamation auprès des autorités compétentes et notamment la CNIL via https://www.cnil.fr/fr/plaintes.",text_054:"9. Cookies et technologies de suivi (Traceurs)",text_055:"Le Site utilise des cookies et d'autres traceurs (petits fichiers texte déposés sur votre terminal) afin d'assurer son bon fonctionnement et d'analyser son utilisation.",text_056:"9.1. Types de cookies utilisés",text_057:"Cookies strictement nécessaires (exemptés de consentement) : Ces cookies techniques et données de connexion sont indispensables pour afficher le site de manière sécurisée et assurer son bon routage informatique. Ils ne collectent aucune donnée comportementale et ne peuvent pas être désactivés.",text_058:"Cookies de mesure d’audience (soumis à consentement) : j’utilise Google Analytics pour établir des statistiques de fréquentation (volume de visites, pages les plus consultées). Ces traceurs reposent sur des identifiants de navigation et ne sont déposés qu’avec votre accord.",text_059:"Cookies publicitaires (soumis à consentement) : J’utilise Google Ads pour évaluer la pertinence et les conversions de mes annonces publicitaires. Ces traceurs permettent de lier votre navigation issue d'une annonce des pages d'atterrissage et ne sont activés qu'avec votre accord explicite.",text_060:"Cookies de réseaux sociaux (soumis à consentement) : lorsque vous activez une publication LinkedIn intégrée au Site, LinkedIn peut déposer ses propres cookies. Ils ne sont déposés qu’après cette activation volontaire de votre part.",text_061:"Les cookies soumis à consentement ont une durée de vie maximale de treize (13) mois.",text_062:"9.2. Gestion du consentement",text_063:"Un gestionnaire de consentement (bandeau cookies) est disponible dès votre arrivée sur le Site. Il vous permet d'accepter ou de refuser le dépôt des cookies Google Analytics et Google Ads, soit globalement, soit de manière granulaire. Tant que vous n'avez pas exprimé votre choix, aucun cookie non essentiel n'est déposé. Vous pouvez modifier vos préférences ou retirer votre consentement à tout moment en cliquant sur le lien « Cookies » situé en bas de chaque page du Site.",text_064:"10. Contact",text_065:"Pour toute question relative à la présente politique de confidentialité ou pour toute demande relative à vos Données, vous pouvez me contacter en envoyant un courriel à : dp@audestya-avocat.com."},_A={text_001:"Politique des Cookies",text_002:"Gestion et paramétrage de vos préférences cookies"},$A={hero:zA,navigation:BA,footer:EA,contact:LA,presentation:JA,honoraires:QA,expertises:YA,actualites:ZA,"mentions-legales":{text_001:"Mentions Légales",text_002:"Informations légales et éditoriales du cabinet Audestya Avocat",text_003:"Le site du cabinet, accessible à l’adresse https://audestya-avocat.com, est désigné ci-après par le « Site ».",text_004:"Éditeur du Site",text_005:" Haia El Zufari",text_006:"Nom :",text_007:" Avocat au Barreau de Paris",text_008:"Profession :",text_009:" Entrepreneur individuel – Profession libérale réglementée",text_010:"Statut :",text_011:" 943 937 789",text_012:"Numéro SIREN :",text_013:" FR 35 943 937 789",text_014:"Numéro de TVA intracommunautaire :",text_016:"Téléphone :",text_018:"Email :",text_019:" 2 rue de Poissy - 75005 Paris - France",text_020:"Adresse postale :",text_021:"Hébergeur du Site",text_02 33 6 85 37 81 80",text_007:"Appel",text_008:"ou",text_009:"SMS"},s0={text_001:"LE CABINET",text_002:"Haia El Zufari",text_003:"Avocate au Barreau de Paris",text_004:"Parcours et formation",text_005:"Principaux domaines d’intervention",text_006:"Droit des contrats • Droit de la distribution et des réseaux • Droit de la consommation et prat",text_007:"Inscription au Barreau",text_008:"Barreau de Paris — 2025",text_009:"Formation",text_010:"Master II Droit européen des affaires",text_011:"Université Paris XI – Jean Monnet",text_012:"Maîtrise Droit européen et international",text_013:"Université Paris II – Panthéon-Assas",text_014:"Langues",text_015:"Français • Anglais • Arabe",text_016:"Les valeurs du cabinet",text_017:"Domaines d’expertise ↗"},i0={text_001:"HONORAIRES"},a0={text_001:"Prendre contact",text_002:"LES EXPERTISES",text_003:"Domaines d’expertise",text_004:"0",text_005:"Découvrir l’expertise",text_006:"← Toutes les expertises",text_007:"0",text_008:"En savoir plus",text_009:"Réduire",text_010:"Échanger sur ce besoin",text_011:"0",text_012:"EXPERTISE SUIVANTE"},o0={text_001:"ANALYSES & PUBLICATIONS",text_002:"Actualités et articles.",text_003:"Les analyses du cabinet et les publications partagées sur LinkedIn.",text_004:"Chargement des publications…",text_005:"Les publications sont momentanément indisponibles. Vous pouvez les retrouver sur LinkedIn.",text_006:"Retrouvez les dernières publications sur LinkedIn.",text_007:"Les articles du cabinet seront également disponibles ici.",text_008:"Lire la publication",text_009:"Toutes les publications sur LinkedIn"},l0={text_001:"Politique de confidentialité",text_002:"La présente politique de confidentialité a pour objet de vous donner une meilleure visibilité sur le traitement de vos données à caractère personnel (ci-après les « Données »). Il est rappelé que, conformément au règlement (UE) 2016/679 du 27 avril 2016 (ci-après le « RGPD ») et à la loi n° 78-17 du 6 janvier 1978 relative à l’informatique, aux fichiers et aux libertés, une Donnée est toute information relative à une personne physique susceptible d'être identifiée, directement ou indirectement.",text_003:"La présente politique s’applique :",text_004:"Aux clients, prospects ou tout autre contact externe ;",text_005:"Aux visiteurs du site www.audestya-avocat.com (ci-après le « Site »).",text_006:"1. Qui est le responsable de traitement ?",text_007:"Haia El Zufari",text_008:"Entrepreneur individuel",text_009:"Avocate au Barreau de Paris",text_010:"Numéro SIREN : 943 937 789",text_011:"2. Comment les Données sont-elles collectées ?",text_012:"Je suis amenée à collecter des Données :",text_013:"Lorsque vous êtes un prospect ou un client potentiel et que vous me contactez directement (par courrier électronique, téléphone ou lors d'un rendez-vous) pour demander des informations ou des conseils ;",text_014:"Lorsque vous êtes client, notamment dans le cadre de la conclusion de la convention d’honoraires et de l’exécution des missions confiées et de tout échange y afférent ;",text_015:"Lorsque vous êtes un partenaire (expert, prestataire, confrère, etc.) avec qui je suis amenée à collaborer, dans le cadre de mon activité et des missions confiées ;",text_016:"Lorsque vous naviguez sur mon Site via les cookies et autres traceurs.",text_017:"3. Quelles sont les Données collectées ?",text_018:"Je collecte et traite notamment :",text_019:"Lors de la prise de contact directe : des Données d'identification du prospect ou du client potentiel qui demande des informations (nom, prénom, adresse électronique, numéro de téléphone, ou toute information spontanément transmise dans votre demande).",text_020:"Dans le cadre de l'exécution de ma mission : des Données d'identification des clients (y compris leurs salariés, représentants ou dirigeants) ainsi que les Données nécessaires à l'exécution de la mission (nom, prénom, adresse, adresse électronique, numéro de téléphone, coordonnées bancaires, date de naissance, pièces d'identité, éléments liés au dossier juridique).",text_021:"Les Données de navigation des visiteurs du Site : collectées automatiquement de manière technique par l’hébergeur (adresse IP, journaux de sécurité) et, sous réserve de votre consentement, par les outils d'analyse (données comportementales, identifiants de navigation).",text_022:"4. Pour quelles finalités sont collectées vos Données ?",text_023:"Vos Données peuvent être traitées pour les finalités suivantes :",text_024:"Si vous êtes un prospect ou un client potentiel : pour répondre à vos demandes directes d’information ou de prise de contact. Ce traitement repose sur l’exécution de mesures précontractuelles prises à votre demande (article 6.1 b du RGPD).",text_025:"Si vous êtes un client : pour (i) l’exécution de la relation contractuelle, sur le fondement de l’exécution du contrat (article 6.1 b du RGPD), et (ii) le respect de mes obligations légales, comptables, fiscales et déontologiques (article 6.1 c du RGPD), notamment pour le traitement des demandes, l’exécution des missions, la gestion de la convention d’honoraires, des factures, de la comptabilité et, plus généralement, le suivi de la relation contractuelle et (iii) le respect de mes obligations de vigilance en matière de lutte contre le blanchiment des capitaux et le financement du terrorisme (article 6.1 c du RGPD).",text_026:"Si vous êtes un partenaire (expert, prestataire, confrère, etc.) : pour (i) la gestion de mon activité et (ii) l’exécution des missions confiées par mes clients, sur le fondement de mon intérêt légitime à organiser mes relations professionnelles et à mener à bien ces missions (article 6.1 f du RGPD), ainsi que pour (iii) le respect de mes obligations légales, comptables, fiscales et déontologiques (article 6.1 c du RGPD).",text_027:"Si vous naviguez sur le Site : pour (i) assurer la sécurité informatique et l’affichage du Site, sur le fondement de mon intérêt légitime à mettre à disposition un site fonctionnel et sécurisé (article 6.1 f du RGPD) ; et, uniquement sous réserve de votre consentement (article 6.1 a du RGPD et article 82 de la loi n° 78-17 du 6 janvier 1978), pour (ii) analyser le trafic du Site (Google Analytics) et (iii) mesurer l’efficacité de mes campagnes publicitaires (Google Ads).",text_028:"5. Avec qui vos Données sont-elles partagées ?",text_029:"Dans la limite des finalités et des traitements définis à l’article 4, je peux être amenée à partager vos Données :",text_030:"Avec des partenaires avec votre consentement explicite.",text_031:"Avec des prestataires techniques : notamment hébergeur, prestataires informatiques, dans le cadre de l’exécution de mes services et l’exercice de mon activité.",text_032:"Aux autorités compétentes, dans les cas prévus par la loi et dans les limites du secret professionnel de l’avocat.",text_033:"Vos Données peuvent également être communiquées, dans les mêmes limites, pour respecter mes obligations légales ou pour protéger les droits, l’intégrité physique, la sécurité ou la sûreté des personnes.",text_034:"6. Quelle est la durée de conservation de vos Données ?",text_035:"Pour les clients et les partenaires, les Données sont conservées pendant toute la durée de la relation contractuelle puis pendant toute la durée de prescription légale, soit cinq (5) ans, qui court à compter du dernier échange avec la personne concernée.",text_036:"Les Données nécessaires à la comptabilité sont, quant à elles, conservées pendant la durée légale de conservation, soit dix (10) ans, pour respecter les obligations comptables et fiscales applicables.",text_037:"Les Données des prospects et des clients potentiels sont conservées pendant une durée de trois (3) ans suivant le dernier contact établi avec la personne concernée.",text_038:"Les documents et informations recueillis au titre de mes obligations de vigilance sont conservés pendant cinq (5) ans à compter de la cessation de la relation d’affaires.",text_039:"7. Vos Données sont-elles transférées en dehors de l’Union Européenne ?",text_040:"Oui, certains traitements de données entraînent des flux en dehors de l’Espace Économique Européen (EEE) :",text_041:"Hébergement du site (GitHub Pages) : L'affichage du site implique le traitement technique de votre adresse IP par GitHub, Inc. sur des serveurs principalement situés aux États-Unis. Ce transfert est encadré par le Data Privacy Framework et les Clauses Contractuelles Types (CCT) incluses dans le GitHub Data Protection Agreement.",text_042:"Gestion des contenus (Supabase) : Les comptes administrateurs, les articles et les images du CMS sont stockés physiquement dans un projet Supabase situé en France (Paris). Toutefois, l'administration de la plateforme et certains sous-traitants techniques peuvent impliquer des transferts hors UE, sécurisés par le Supabase Data Processing Addendum.",text_043:"Mesure d'audience et Publicité (Google Analytics & Google Ads) : Sous réserve de votre consentement préalable (via le bandeau de cookies), j’utilise les services de Google pour analyser les visites (Google Analytics) et mesurer l'efficacité de mes campagnes (Google Ads). Ces services impliquent le dépôt de cookies et le traitement d'identifiants de navigation transférés vers les États-Unis. Ces flux sont encadrés par les Conditions de traitement des données de Google et le Data Privacy Framework. Vous pouvez retirer votre consentement à tout moment.",text_044:"Réseaux sociaux (LinkedIn) : les publications LinkedIn intégrées au Site ne chargent aucun script et n’entraînent aucune transmission de Données à LinkedIn tant que vous ne les avez pas activées. Après une activation volontaire de votre part, LinkedIn traite des Données vous concernant (notamment votre adresse IP et des identifiants de navigation) et peut déposer ses propres cookies. Ces Données peuvent être transférées vers les États-Unis. LinkedIn est responsable des traitements qu’il effectue ensuite ; je vous invite à consulter sa politique de confidentialité.",text_045:"8. Quels sont vos droits ?",text_046:"Conformément à la réglementation en vigueur, vous disposez des droits suivants :",text_047:"Le droit d’accès : Vous avez le droit (i) d'obtenir la confirmation que des Données vous concernant sont ou ne sont pas traitées et, lorsqu'elles le sont, (ii) d'obtenir l'accès auxdites Données et une copie de ces dernières.",text_048:"Le droit de rectification : Vous avez le droit d'obtenir la rectification des Données vous concernant qui sont inexactes ou incomplètes.",text_049:"Le droit à l’effacement : Vous avez le droit d’obtenir l’effacement de vos Données. Je me réserve néanmoins la possibilité pour des raisons légales ou légitimes de conserver ces Données.",text_050:"Le droit à la limitation du traitement : Dans certains cas, vous avez le droit d'obtenir la limitation du traitement de vos Données.",text_051:"Le droit à la portabilité : Vous pouvez demander à recevoir vos Données vous concernant dans un format structuré, couramment utilisé et lisible par machine.",text_052:"Le droit d’opposition : Vous avez le droit de vous opposer à tout moment, pour des raisons tenant à votre situation particulière, à un traitement de Données vous concernant lorsque vos intérêts ou libertés et droits fondamentaux exigent une protection. Je me réserve néanmoins la possibilité d’invoquer des motifs légitimes et impérieux nécessitant la poursuite du traitement. Il en va de même aux fins de constatation, d'exercice ou de défense de droits en justice.",text_053:"Pour exercer ces droits, vous pouvez adresser une demande, par courriel à : dp@audestya-avocat.com. En cas de difficulté en lien avec la gestion des Données, vous pouvez adresser une réclamation auprès des autorités compétentes et notamment la CNIL via https://www.cnil.fr/fr/plaintes.",text_054:"9. Cookies et technologies de suivi (Traceurs)",text_055:"Le Site utilise des cookies et d'autres traceurs (petits fichiers texte déposés sur votre terminal) afin d'assurer son bon fonctionnement et d'analyser son utilisation.",text_056:"9.1. Types de cookies utilisés",text_057:"Cookies strictement nécessaires (exemptés de consentement) : Ces cookies techniques et données de connexion sont indispensables pour afficher le site de manière sécurisée et assurer son bon routage informatique. Ils ne collectent aucune donnée comportementale et ne peuvent pas être désactivés.",text_058:"Cookies de mesure d’audience (soumis à consentement) : j’utilise Google Analytics pour établir des statistiques de fréquentation (volume de visites, pages les plus consultées). Ces traceurs reposent sur des identifiants de navigation et ne sont déposés qu’avec votre accord.",text_059:"Cookies publicitaires (soumis à consentement) : J’utilise Google Ads pour évaluer la pertinence et les conversions de mes annonces publicitaires. Ces traceurs permettent de lier votre navigation issue d'une annonce des pages d'atterrissage et ne sont activés qu'avec votre accord explicite.",text_060:"Cookies de réseaux sociaux (soumis à consentement) : lorsque vous activez une publication LinkedIn intégrée au Site, LinkedIn peut déposer ses propres cookies. Ils ne sont déposés qu’après cette activation volontaire de votre part.",text_061:"Les cookies soumis à consentement ont une durée de vie maximale de treize (13) mois.",text_062:"9.2. Gestion du consentement",text_063:"Un gestionnaire de consentement (bandeau cookies) est disponible dès votre arrivée sur le Site. Il vous permet d'accepter ou de refuser le dépôt des cookies Google Analytics et Google Ads, soit globalement, soit de manière granulaire. Tant que vous n'avez pas exprimé votre choix, aucun cookie non essentiel n'est déposé. Vous pouvez modifier vos préférences ou retirer votre consentement à tout moment en cliquant sur le lien « Cookies » situé en bas de chaque page du Site.",text_064:"10. Contact",text_065:"Pour toute question relative à la présente politique de confidentialité ou pour toute demande relative à vos Données, vous pouvez me contacter en envoyant un courriel à : dp@audestya-avocat.com."},c0={text_001:"Politique des Cookies",text_002:"Gestion et paramétrage de vos préférences cookies"},u0={hero:e0,navigation:t0,footer:n0,contact:r0,presentation:s0,honoraires:i0,expertises:a0,actualites:o0,"mentions-legales":{text_001:"Mentions Légales",text_002:"Informations légales et éditoriales du cabinet Audestya Avocat",text_003:"Le site du cabinet, accessible à l’adresse https://audestya-avocat.com, est désigné ci-après par le « Site ».",text_004:"Éditeur du Site",text_005:"Haia El Zufari",text_006:"Nom :",text_007:"Avocat au Barreau de Paris",text_008:"Profession :",text_009:"Entrepreneur individuel – Profession libérale réglementée",text_010:"Statut :",text_011:"943 937 789",text_012:"Numéro SIREN :",text_013:"FR 35 943 937 789",text_014:"Numéro de TVA intracommunautaire :",text_015:"+33 6 85 37 81 80",text_016:"Téléphone :",text_017:"haia.elzufari@audestya-avocat.com",text_018:"Email :",text_019:"2 rue de Poissy - 75005 Paris - France",text_020:"Adresse postale :",text_021:"Hébergeur du Site",text_022:"GitHub, Inc.",text_023:"Société :",text_024:"GitHub Pages",text_025:"Service d’hébergement :",text_026:"88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis",text_027:"Adresse postale :",text_028:"https://support.github.com/",text_029:"Contact en ligne :",text_030:"Propriété intellectuelle",text_031:"Le contenu du Site (textes, images, logos, graphismes, etc.) est protégé par le droit de la pro",text_032:"Toute reproduction ou utilisation, totale ou partielle, sans autorisation écrite préalable est "},confidentialite:l0,cookies:c0,"reglages-cookies":{text_001:"Paramètres des cookies",text_002:"Gérez vos préférences en matière de cookies sur ce site.",text_003:"Cookies strictement nécessaires",text_004:"Toujours actifs",text_005:"Ces cookies sont indispensables à l’affichage sécurisé du site et à la mémorisation de vos choix en matière de cookies. Ils ne peuvent pas être désactivés.",text_006:"Co
